name: Deploy backend to ssh.mendola.tech

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ssh.mendola.tech
      DEPLOY_USER: aeml
      DEPLOY_PATH: ~/open_crm
      DEPLOY_API_URL: https://crmserver.mendola.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up SSH key and known hosts
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          import re
          import sys
          from pathlib import Path

          raw = os.environ.get('SSH_PRIVATE_KEY', '')
          if not raw.strip():
              raise SystemExit('SSH_PRIVATE_KEY is empty')

          normalized = raw.replace('\r\n', '\n').replace('\r', '\n').strip()

          if normalized[:1] == normalized[-1:] and normalized[:1] in {'"', "'"}:
              normalized = normalized[1:-1].strip()

          if '\\n' in normalized:
              normalized = normalized.replace('\\n', '\n')

          if 'BEGIN' not in normalized and re.fullmatch(r'[A-Za-z0-9+/=\n]+', normalized):
              try:
                  decoded = base64.b64decode(normalized).decode('utf-8')
              except Exception:
                  decoded = None
              if decoded and 'BEGIN' in decoded:
                  normalized = decoded.strip()

          lines = [line.rstrip() for line in normalized.split('\n') if line.strip()]
          if lines and lines[0].startswith('-----BEGIN ') and lines[-1].startswith('-----END '):
              normalized = '\n'.join(lines)
          else:
              raise SystemExit('SSH_PRIVATE_KEY is not a recognizable private key format')

          if not normalized.endswith('\n'):
              normalized += '\n'

          key_path = Path.home().joinpath('.ssh', 'id_ed25519')
          key_path.write_text(normalized)
          print(f'Wrote SSH key with {len(lines)} non-empty lines; header={lines[0]}')
          PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -l -f ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          cat > ~/.ssh/known_hosts <<'EOF'
          ssh.mendola.tech ssh-rsa 
          ssh.mendola.tech ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBMlVVcJeHlJFmorFIxpFn91ERrjnKH2LIjgbP8oZLLRHZIdoy7q8Rnq6+axL5flPKQ+Uc+8NyZkkMSXb/eo6w2Y=
          ssh.mendola.tech ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGiPjpRvGPRwDs4CoG7cAk412OIiNsrlllMFoCuMM5w8
          EOF
          chmod 644 ~/.ssh/known_hosts

      - name: Prepare remote directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_PATH}"

      - name: Upload deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env.production' \
            --exclude 'var' \
            --exclude 'apps/web/node_modules' \
            --exclude 'apps/web/dist' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/

      - name: Upload production environment file
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/open_crm.env <<'EOF'
          ${{ secrets.DEPLOY_ENV }}
          EOF
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes /tmp/open_crm.env ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.env.production
          rm -f /tmp/open_crm.env

      - name: Deploy stack on remote host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes ${DEPLOY_USER}@${DEPLOY_HOST} "chmod +x ${DEPLOY_PATH}/scripts/remote-deploy.sh && ${DEPLOY_PATH}/scripts/remote-deploy.sh ${DEPLOY_PATH} ${GITHUB_SHA}"

      - name: Verify backend readiness
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          curl_options=(
            --fail --show-error --silent
            --connect-timeout 5 --max-time 20
          )

          probe_from_runner() {
            local deadline=$((SECONDS + 240))
            while (( SECONDS < deadline )); do
              if curl "${curl_options[@]}" "${DEPLOY_API_URL}/healthz" > /dev/null; then
                : > "$headers"
                if curl "${curl_options[@]}" --dump-header "$headers" "${DEPLOY_API_URL}/readyz" > /dev/null; then
                  grep -Fqi "X-Open-CRM-Release: ${GITHUB_SHA}" "$headers" || return 2
                  return 0
                fi
              fi
              sleep 5
            done
            return 1
          }

          runner_probe_status=0
          probe_from_runner || runner_probe_status=$?
          if [[ "$runner_probe_status" -eq 0 ]]; then
            echo "Public health and exact-release readiness passed from the GitHub-hosted runner."
          elif [[ "$runner_probe_status" -eq 2 ]]; then
            echo "Public readiness endpoint does not report expected release ${GITHUB_SHA}." >&2
            exit 1
          else
            echo "::warning::The GitHub-hosted runner could not reach the public API after bounded retries; repeating the public-hostname probe from the production host."
            echo "Hosted-runner public probe failed; production-host public fallback required." >> "$GITHUB_STEP_SUMMARY"
            ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o ConnectTimeout=10 \
              ${DEPLOY_USER}@${DEPLOY_HOST} bash -s -- "${DEPLOY_API_URL}" "${GITHUB_SHA}" <<'REMOTE'
          set -euo pipefail
          api_url="$1"
          expected_release="$2"
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          curl_options=(
            --fail --show-error --silent
            --connect-timeout 5 --max-time 20
          )
          deadline=$((SECONDS + 240))
          while (( SECONDS < deadline )); do
            if curl "${curl_options[@]}" "${api_url}/healthz" > /dev/null; then
              : > "$headers"
              if curl "${curl_options[@]}" --dump-header "$headers" "${api_url}/readyz" > /dev/null; then
                if ! grep -Fqi "X-Open-CRM-Release: ${expected_release}" "$headers"; then
                  echo "Public readiness endpoint does not report expected release ${expected_release}." >&2
                  exit 2
                fi
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Public API did not recover within the bounded readiness window." >&2
          exit 1
          REMOTE
          fi
