name: Deploy backend to ssh.mendola.tech

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'docker-compose.deploy.yml'
      - 'scripts/remote-deploy.sh'
      - '.github/workflows/backend-deploy.yml'
      - '.dockerignore'
      - 'README.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ssh.mendola.tech
      DEPLOY_USER: aeml
      DEPLOY_PATH: ~/open_crm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key and known hosts
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ['SSH_PRIVATE_KEY']
          normalized = raw.replace('\r\n', '\n').replace('\r', '\n').strip()
          if '\\n' in normalized and '-----BEGIN' in normalized:
              normalized = normalized.replace('\\n', '\n')
          if not normalized.endswith('\n'):
              normalized += '\n'
          Path.home().joinpath('.ssh', 'id_ed25519').write_text(normalized)
          PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          cat > ~/.ssh/known_hosts <<'EOF'
          ssh.mendola.tech ssh-rsa 
          ssh.mendola.tech ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBMlVVcJeHlJFmorFIxpFn91ERrjnKH2LIjgbP8oZLLRHZIdoy7q8Rnq6+axL5flPKQ+Uc+8NyZkkMSXb/eo6w2Y=
          ssh.mendola.tech ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGiPjpRvGPRwDs4CoG7cAk412OIiNsrlllMFoCuMM5w8
          EOF
          chmod 644 ~/.ssh/known_hosts

      - name: Prepare remote directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_PATH}"

      - name: Upload deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'apps/web/node_modules' \
            --exclude 'apps/web/dist' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/

      - name: Upload production environment file
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/open_crm.env <<'EOF'
          ${{ secrets.DEPLOY_ENV }}
          EOF
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes /tmp/open_crm.env ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.env.production
          rm -f /tmp/open_crm.env

      - name: Deploy stack on remote host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes ${DEPLOY_USER}@${DEPLOY_HOST} "chmod +x ${DEPLOY_PATH}/scripts/remote-deploy.sh && ${DEPLOY_PATH}/scripts/remote-deploy.sh ${DEPLOY_PATH}"
