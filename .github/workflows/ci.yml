name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - '.github/workflows/ci.yml'
      - '.github/dependabot.yml'
      - 'go.work'
      - 'Makefile'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: open_crm_test
          POSTGRES_USER: open_crm
          POSTGRES_PASSWORD: open_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_crm -d open_crm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: apps/api/go.sum

      - name: Check go mod tidy
        working-directory: apps/api
        run: |
          set -euo pipefail
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' in apps/api and commit the result."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Check Go formatting
        working-directory: apps/api
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Run Go vet
        working-directory: apps/api
        run: go vet ./...

      - name: Run backend tests
        working-directory: apps/api
        env:
          OPEN_CRM_TEST_DATABASE_URL: postgres://open_crm:open_crm@localhost:5432/open_crm_test?sslmode=disable
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Run frontend tests
        working-directory: apps/web
        run: npm test

      - name: Run frontend lint
        working-directory: apps/web
        run: npm run lint

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://crmserver.mendola.tech
        run: npm run build
