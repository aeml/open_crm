name: Deploy frontend to GitHub Pages

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/web
        run: npm test

      - name: Build frontend for Pages
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://crmserver.mendola.tech
          GITHUB_ACTIONS: 'true'
        run: npm run build:pages

      - name: Copy SPA fallback
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          printf '%s\n' "$GITHUB_SHA" > apps/web/dist/open-crm-release.txt

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed frontend
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          notices="$(mktemp)"
          release="$(mktemp)"
          trap 'rm -f "$notices" "$release"' EXIT
          page_url="$PAGE_URL"
          case "$page_url" in
            http://*|https://*) ;;
            *)
              echo "Pages returned an invalid deployment URL." >&2
              exit 1
              ;;
          esac
          https_url="https://${page_url#*://}"
          https_url="${https_url%/}"
          curl --fail --show-error --silent \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "$https_url/?release=${GITHUB_SHA}" > /dev/null
          curl --fail --show-error --silent \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "$https_url/THIRD_PARTY_NOTICES.md?release=${GITHUB_SHA}" > "$notices"
          grep -Fqx '# Third-Party Notices' "$notices"
          curl --fail --show-error --silent \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "$https_url/open-crm-release.txt?release=${GITHUB_SHA}" > "$release"
          grep -Fqx "$GITHUB_SHA" "$release"
