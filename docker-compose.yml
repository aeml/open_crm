services:
  postgres:
    image: postgres:16.14@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    restart: unless-stopped
    environment:
      POSTGRES_DB: open_crm
      POSTGRES_USER: open_crm
      POSTGRES_PASSWORD: open_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_crm -d open_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
