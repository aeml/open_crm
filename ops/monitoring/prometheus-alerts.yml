groups:
  - name: open-crm-production-trust
    interval: 30s
    rules:
      - alert: OpenCRMMetricsCollectionFailed
        expr: open_crm_metrics_collection_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Open CRM cannot collect all operational metrics
          runbook: docs/operations-runbook.md#monitoring-and-alerts

      - alert: OpenCRMDatabaseUnavailable
        expr: open_crm_database_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Open CRM PostgreSQL readiness is failing
          runbook: docs/operations-runbook.md#database-or-api-incident

      - alert: OpenCRMHTTPErrorRateHigh
        expr: (sum(rate(open_crm_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(open_crm_http_requests_total[5m])), 0.001)) > 0.05 and sum(rate(open_crm_http_requests_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Open CRM 5xx ratio exceeds 5 percent
          runbook: docs/operations-runbook.md#database-or-api-incident

      - alert: OpenCRMHTTPLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(open_crm_http_request_duration_seconds_bucket[10m]))) > 2 and sum(rate(open_crm_http_requests_total[10m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Open CRM p95 API latency exceeds 2 seconds
          runbook: docs/operations-runbook.md#database-or-api-incident

      - alert: OpenCRMQueueMetricsUnavailable
        expr: open_crm_background_jobs_available == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Open CRM durable queue health cannot be read
          runbook: docs/operations-runbook.md#background-jobs-and-dead-letter-recovery

      - alert: OpenCRMBackgroundJobLagHigh
        expr: open_crm_background_job_oldest_ready_lag_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Open CRM has runnable work delayed by more than 5 minutes
          runbook: docs/operations-runbook.md#background-jobs-and-dead-letter-recovery

      - alert: OpenCRMDeadBackgroundJobs
        expr: open_crm_background_jobs{status="dead"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM has dead-lettered background jobs
          runbook: docs/operations-runbook.md#background-jobs-and-dead-letter-recovery

      - alert: OpenCRMWorkerCycleErrors
        expr: increase(open_crm_background_job_outcomes_total{job_type="_worker",outcome="cycle_error"}[10m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Open CRM background worker cannot claim or finalize work
          runbook: docs/operations-runbook.md#background-jobs-and-dead-letter-recovery

      - alert: OpenCRMProviderFailures
        expr: increase(open_crm_provider_operations_total{outcome="error"}[15m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Open CRM observed provider operation failures
          runbook: docs/operations-runbook.md#provider-incident

      - alert: OpenCRMPasswordResetMetricsUnavailable
        expr: open_crm_password_resets_available != 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM cannot collect password-reset delivery health
          runbook: docs/operations-runbook.md#password-recovery

      - alert: OpenCRMPasswordResetDeliveryFailures
        expr: open_crm_password_reset_delivery_failed_24h > 0 or open_crm_password_reset_delivery_stale_pending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM has failed or stale password-reset email delivery
          runbook: docs/operations-runbook.md#password-recovery

      - alert: OpenCRMSystemEmailFeedbackUnavailable
        expr: open_crm_system_email_feedback_available != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Open CRM cannot read durable system-email feedback
          runbook: docs/operations-runbook.md#system-email-feedback

      - alert: OpenCRMSystemEmailComplaints
        expr: open_crm_system_email_complaints_24h > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A recipient reported Open CRM system email as spam
          runbook: docs/operations-runbook.md#system-email-feedback

      - alert: OpenCRMSystemEmailFeedbackUnapplied
        expr: open_crm_system_email_feedback_unapplied_24h > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Authenticated Postmark feedback did not match an active Open CRM delivery attempt
          runbook: docs/operations-runbook.md#system-email-feedback

      - alert: OpenCRMSystemEmailBouncesHigh
        expr: open_crm_system_email_bounces_24h > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Open CRM system email has elevated bounce volume
          runbook: docs/operations-runbook.md#system-email-feedback

      - alert: OpenCRMCustomerEmailFeedbackUnavailable
        expr: open_crm_customer_email_feedback_available != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Open CRM cannot read durable customer-email feedback
          runbook: docs/operations-runbook.md#customer-email-delivery-feedback

      - alert: OpenCRMCustomerEmailComplaints
        expr: open_crm_customer_email_complaints_24h > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A customer reported workspace email as abusive
          runbook: docs/operations-runbook.md#customer-email-delivery-feedback

      - alert: OpenCRMCustomerEmailFeedbackUnapplied
        expr: open_crm_customer_email_feedback_unapplied_24h > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Customer-email feedback failed exact safe correlation
          runbook: docs/operations-runbook.md#customer-email-delivery-feedback

      - alert: OpenCRMCustomerEmailBouncesHigh
        expr: open_crm_customer_email_bounces_24h > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Customer-email delivery has elevated terminal bounce volume
          runbook: docs/operations-runbook.md#customer-email-delivery-feedback

      - alert: OpenCRMRateLimitStoreErrors
        expr: sum(increase(open_crm_rate_limit_decisions_total{outcome="error"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Open CRM public abuse controls cannot reach their shared store
          runbook: docs/operations-runbook.md#public-endpoint-abuse-controls

      - alert: OpenCRMPublicRateLimitRejectionsHigh
        expr: sum(increase(open_crm_rate_limit_decisions_total{outcome="rejected"}[10m])) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM is rejecting elevated public endpoint traffic
          runbook: docs/operations-runbook.md#public-endpoint-abuse-controls

      - alert: OpenCRMLeadSubmissionErrors
        expr: sum(increase(open_crm_lead_submission_outcomes_total{outcome="error"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Open CRM public lead capture is failing internally
          runbook: docs/operations-runbook.md#public-endpoint-abuse-controls

      - alert: OpenCRMLeadSubmissionRejectionsHigh
        expr: sum(increase(open_crm_lead_submission_outcomes_total{outcome="rejected"}[10m])) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM is rejecting elevated public lead submissions
          runbook: docs/operations-runbook.md#public-endpoint-abuse-controls

      - alert: OpenCRMLeadReviewMetricsUnavailable
        expr: open_crm_lead_reviews_available != 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM cannot collect lead-submission review health
          runbook: docs/operations-runbook.md#lead-submission-spam-review-and-recovery

      - alert: OpenCRMLeadReviewStale
        expr: open_crm_lead_reviews{state="unreviewed"} > 0 and open_crm_lead_review_oldest_unreviewed_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A captured lead has awaited review for more than 24 hours
          description: Review the bounded queue in Settings > Lead Forms before relying on automatic qualification or routing.
          runbook: docs/operations-runbook.md#lead-submission-spam-review-and-recovery

      - alert: OpenCRMNotificationMetricsUnavailable
        expr: open_crm_notifications_available == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Open CRM notification health cannot be read
          runbook: docs/operations-runbook.md#notification-retention-and-noise

      - alert: OpenCRMNotificationRetentionErrors
        expr: open_crm_notification_retention_last_run_timestamp_seconds > 0 and open_crm_notification_retention_last_run_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Open CRM notification retention is failing
          runbook: docs/operations-runbook.md#notification-retention-and-noise

      - alert: OpenCRMNotificationRetentionStale
        expr: open_crm_notifications_available == 1 and (open_crm_notification_retention_last_run_timestamp_seconds == 0 or time() - open_crm_notification_retention_last_run_timestamp_seconds > 7200)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM notification retention has not completed for two hours
          runbook: docs/operations-runbook.md#notification-retention-and-noise

      - alert: OpenCRMNotificationRecipientVolumeHigh
        expr: open_crm_notification_max_per_recipient_24h > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: One Open CRM recipient has elevated notification volume
          runbook: docs/operations-runbook.md#notification-retention-and-noise

      - alert: OpenCRMEmailTrackingRetentionErrors
        expr: open_crm_email_tracking_retention_last_run_timestamp_seconds > 0 and open_crm_email_tracking_retention_last_run_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Open CRM email engagement retention is failing
          runbook: docs/operations-runbook.md#email-engagement-tracking-privacy-and-retention

      - alert: OpenCRMEmailTrackingRetentionStale
        expr: open_crm_database_up == 1 and (open_crm_email_tracking_retention_last_run_timestamp_seconds == 0 or time() - open_crm_email_tracking_retention_last_run_timestamp_seconds > 7200)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM email engagement retention has not completed for two hours
          runbook: docs/operations-runbook.md#email-engagement-tracking-privacy-and-retention

      - alert: OpenCRMEmailReplyMetricsUnavailable
        expr: open_crm_email_replies_available != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Open CRM cannot read durable connected-mailbox reply health
          runbook: docs/operations-runbook.md#connected-mailbox-reply-recovery

      - alert: OpenCRMEmailReplyRecoveryErrors
        expr: open_crm_email_reply_recovery_last_run_timestamp_seconds > 0 and open_crm_email_reply_recovery_last_run_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Open CRM interrupted-reply recovery is failing
          runbook: docs/operations-runbook.md#connected-mailbox-reply-recovery

      - alert: OpenCRMEmailReplyRecoveryStale
        expr: open_crm_database_up == 1 and (open_crm_email_reply_recovery_last_run_timestamp_seconds == 0 or time() - open_crm_email_reply_recovery_last_run_timestamp_seconds > 300)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM interrupted-reply recovery has not completed for five minutes
          runbook: docs/operations-runbook.md#connected-mailbox-reply-recovery

      - alert: OpenCRMEmailRepliesNeedResolution
        expr: open_crm_email_reply_uncertain > 0 or open_crm_email_reply_stale_sending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Connected-mailbox replies require explicit operator resolution
          runbook: docs/operations-runbook.md#connected-mailbox-reply-recovery

      - alert: OpenCRMRecordEmailDeliveryMetricsUnavailable
        expr: open_crm_record_email_deliveries_available != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Open CRM cannot read durable one-to-one record-email delivery health
          runbook: docs/operations-runbook.md#one-to-one-record-email-delivery-recovery

      - alert: OpenCRMRecordEmailDeliveryRecoveryErrors
        expr: open_crm_record_email_delivery_recovery_last_run_timestamp_seconds > 0 and open_crm_record_email_delivery_recovery_last_run_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Open CRM interrupted record-email recovery is failing
          runbook: docs/operations-runbook.md#one-to-one-record-email-delivery-recovery

      - alert: OpenCRMRecordEmailDeliveryRecoveryStale
        expr: open_crm_database_up == 1 and (open_crm_record_email_delivery_recovery_last_run_timestamp_seconds == 0 or time() - open_crm_record_email_delivery_recovery_last_run_timestamp_seconds > 300)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM record-email recovery has not completed for five minutes
          runbook: docs/operations-runbook.md#one-to-one-record-email-delivery-recovery

      - alert: OpenCRMRecordEmailsNeedResolution
        expr: open_crm_record_email_delivery_uncertain > 0 or open_crm_record_email_delivery_stale_sending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: One-to-one record emails require explicit operator resolution
          runbook: docs/operations-runbook.md#one-to-one-record-email-delivery-recovery

      - alert: OpenCRMQuoteDeliveryMetricsUnavailable
        expr: open_crm_quote_deliveries_available != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Open CRM cannot read durable finalized-quote delivery health
          runbook: docs/operations-runbook.md#finalized-quote-delivery-and-receipt-recovery

      - alert: OpenCRMQuoteDeliveryRecoveryErrors
        expr: open_crm_quote_delivery_recovery_last_run_timestamp_seconds > 0 and open_crm_quote_delivery_recovery_last_run_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Open CRM interrupted quote-delivery recovery is failing
          runbook: docs/operations-runbook.md#finalized-quote-delivery-and-receipt-recovery

      - alert: OpenCRMQuoteDeliveryRecoveryStale
        expr: open_crm_database_up == 1 and (open_crm_quote_delivery_recovery_last_run_timestamp_seconds == 0 or time() - open_crm_quote_delivery_recovery_last_run_timestamp_seconds > 300)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Open CRM quote-delivery recovery has not completed for five minutes
          runbook: docs/operations-runbook.md#finalized-quote-delivery-and-receipt-recovery

      - alert: OpenCRMQuoteDeliveriesNeedResolution
        expr: open_crm_quote_delivery_uncertain > 0 or open_crm_quote_delivery_stale_sending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Finalized-quote deliveries require explicit operator resolution
          runbook: docs/operations-runbook.md#finalized-quote-delivery-and-receipt-recovery

      - alert: OpenCRMQuoteApprovalsStale
        expr: open_crm_quote_approval_pending > 0 and open_crm_quote_approval_oldest_pending_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Immutable quote PDFs have awaited independent approval for more than one day
          runbook: docs/operations-runbook.md#quote-preparation-and-independent-approval

      - alert: OpenCRMQuoteSignaturesExpired
        expr: open_crm_quote_signature_expired > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Sent quote-signature requests have expired without a recipient decision
          runbook: docs/operations-runbook.md#finalized-quote-delivery-and-receipt-recovery

      - alert: OpenCRMQuoteSignaturesAwaitingConversion
        expr: open_crm_quote_signature_awaiting_conversion > 0 and open_crm_quote_signature_oldest_awaiting_conversion_age_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Signed quotes are awaiting deliberate won-deal conversion and client handoff
          runbook: docs/operations-runbook.md#finalized-quote-delivery-and-receipt-recovery

      - alert: OpenCRMWorkflowRunStalled
        expr: open_crm_workflow_runs_available == 1 and open_crm_workflow_oldest_active_age_seconds > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A durable workflow run has remained active for too long
          description: Inspect the workflow run and background job queues before replaying or editing the rule.
          runbook: docs/operations-runbook.md#durable-lead-follow-up-automation

      - alert: OpenCRMWorkflowRunFailed
        expr: open_crm_workflow_runs_available == 1 and open_crm_workflow_runs_failed_24h > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A workflow run ended in a terminal failure
          description: Inspect the retained run reason; lead follow-up failures commonly require choosing an active assignee.
          runbook: docs/operations-runbook.md#durable-lead-follow-up-automation

      - alert: OpenCRMBackupStatusUnavailable
        expr: open_crm_backup_status_available == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Open CRM cannot read verified backup and restore evidence
          runbook: docs/operations-runbook.md#encrypted-off-host-postgresql-backups

      - alert: OpenCRMLatestBackupAttemptFailed
        expr: open_crm_backup_status_available == 1 and open_crm_backup_last_attempt_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The latest Open CRM backup attempt failed
          runbook: docs/operations-runbook.md#encrypted-off-host-postgresql-backups

      - alert: OpenCRMBackupStale
        expr: time() - open_crm_backup_last_success_timestamp_seconds > 108000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Open CRM has no verified backup from the last 30 hours
          runbook: docs/operations-runbook.md#encrypted-off-host-postgresql-backups

      - alert: OpenCRMLatestRestoreDrillFailed
        expr: open_crm_backup_status_available == 1 and open_crm_restore_drill_last_attempt_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The latest Open CRM restore drill failed
          runbook: docs/operations-runbook.md#restore-drill

      - alert: OpenCRMRestoreDrillStale
        expr: time() - open_crm_restore_drill_last_success_timestamp_seconds > 691200
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Open CRM has no verified restore drill from the last 8 days
          runbook: docs/operations-runbook.md#restore-drill
